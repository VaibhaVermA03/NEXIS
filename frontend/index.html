<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfdfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a181e" />
    <link rel="icon" type="image/svg+xml" href="/brand/nexis-logo.svg" />
    <link rel="preload" href="/fonts/GarneFont.otf" as="font" type="font/otf" crossorigin />
    <meta name="description" content="NEXIS: create AI agents, authorize tools, execute tasks, monitor every step." />
    <title>NEXIS — From Intent to Execution</title>
    <script>
      // Apply persisted theme before first paint (theme preference only; no auth data is stored in the browser).
      try {
        var t = localStorage.getItem('nexis-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
