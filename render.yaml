# Render Blueprint (backend + managed PostgreSQL). Frontend is deployed on Vercel (see DEPLOYMENT.md).
# Not executed by the author. Fill every `sync: false` secret in the Render dashboard.
databases:
  - name: nexis-db
    plan: basic-256mb
    databaseName: nexis
    user: nexis

services:
  - type: web
    name: nexis-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    # Explicit migration step before each deploy goes live (availability of preDeployCommand depends on your plan;
    # otherwise run `alembic upgrade head` once from a Render Shell / one-off job before first start).
    preDeployCommand: python -m app.db.init_db --migrate-only
    envVars:
      - { key: APP_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: nexis-db, property: connectionString } }
      - { key: APP_SECRET_KEY, generateValue: true }
      - { key: TOOL_SECRET_ENCRYPTION_KEY, sync: false }
      - { key: FRONTEND_URL, sync: false }          # e.g. https://app.example.com
      - { key: BACKEND_URL, sync: false }           # e.g. https://api.example.com
      - { key: CORS_ORIGINS, sync: false }          # e.g. https://app.example.com
      - { key: COOKIE_SECURE, value: "true" }
      - { key: COOKIE_SAMESITE, value: lax }        # use "none" only for cross-site frontend/backend domains
      - { key: COOKIE_DOMAIN, sync: false }         # e.g. .example.com when app. and api. share a parent domain
      - { key: OPENAI_API_KEY, sync: false }
      - { key: OPENAI_MODEL, value: gpt-4o-mini }
      - { key: TAVILY_API_KEY, sync: false }        # optional: enables the web_search tool
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: GOOGLE_REDIRECT_URI, sync: false }   # https://api.example.com/api/v1/auth/google/callback
      - { key: LOG_LEVEL, value: INFO }