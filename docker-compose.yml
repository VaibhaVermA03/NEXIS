# Local full stack: PostgreSQL + one-shot migration job + API + static frontend (nginx proxies /api, same-origin cookies).
#   cp .env.example .env     # then set APP_SECRET_KEY and TOOL_SECRET_ENCRYPTION_KEY (see README)
#   docker compose up --build
# Open http://localhost:8080
# NOTE: this compose file has not been executed by the author (Docker was unavailable in the build sandbox).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexis_local_only}
      POSTGRES_DB: nexis
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexis -d nexis"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["python", "-m", "app.db.init_db"]
    environment: &backend-env
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      DATABASE_URL: postgresql://nexis:${POSTGRES_PASSWORD:-nexis_local_only}@db:5432/nexis
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
      TOOL_SECRET_ENCRYPTION_KEY: ${TOOL_SECRET_ENCRYPTION_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: "" }
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata: