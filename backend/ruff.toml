line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "B008", "S101"]  # B008: FastAPI Depends() defaults are idiomatic; S101: asserts in tests

[lint.per-file-ignores]
"app/tests/*" = ["S105", "S106", "S311", "S108"]
"app/models/*" = ["UP037"]
